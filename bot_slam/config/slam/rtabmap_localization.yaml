# ==============================================================================
# RTABMap Localization Configuration (Pure Localization Mode)
# RTABMap定位配置（纯定位模式）
# ==============================================================================
#
# Purpose / 用途:
#   Localization only (no mapping) using pre-built RTABMap database
#   仅定位（不建图），使用预先构建的RTABMap数据库
#
# Differences from SLAM mode / 与SLAM模式的区别:
#   - Mem/IncrementalMemory: false (不建图)
#   - Mem/InitWMWithAllNodes: true (加载完整地图)
#   - Lower computational load (~60-70% of SLAM)
#   - Database loaded from map library
#
# Usage / 使用方法:
#   - Must specify database path with -d flag when launching rtabmap node
#   - Database should be saved from previous exploration session
#
# ==============================================================================

rtabmap:
  ros__parameters:
    # ========================================================================
    # Basic Configuration / 基础配置
    # ========================================================================
    
    # Use simulation time / 使用仿真时间
    use_sim_time: true
    
    # Frame IDs / 坐标系ID
    frame_id: base_link              # Robot base frame / 机器人基座坐标系
    odom_frame_id: odom              # Odometry frame / 里程计坐标系
    map_frame_id: map                # Map frame / 地图坐标系
    
    # ========================================================================
    # Topic Subscription / 话题订阅
    # ========================================================================
    
    # Subscribe to RGB-D data / 订阅RGB-D数据
    subscribe_rgb: true              # Subscribe to RGB image / 订阅RGB图像
    subscribe_depth: true            # Subscribe to depth image / 订阅深度图像
    subscribe_scan: false            # Don't use laser scan / 不使用激光扫描
    subscribe_stereo: false          # Not using stereo camera / 不使用双目相机
    
    # Odometry source / 里程计来源
    subscribe_odom_info: false       # Don't need odom info / 不需要里程计信息
    
    # ========================================================================
    # RGB-D Parameters / RGB-D参数
    # ========================================================================
    
    rgbd_cameras: 1                  # Number of RGB-D cameras / RGB-D相机数量
    
    # Synchronization / 同步
    approx_sync: true
    approx_sync_max_interval: 0.01   # Max 10ms difference / 最大10ms差异
    
    # Queue size / 队列大小
    queue_size: 10                   # Reasonable buffer / 合理的缓冲
    
    # ========================================================================
    # Visual Odometry / 视觉里程计
    # ========================================================================
    
    # Estimation type / 估计类型
    Vis/EstimationType: "1"          # 1=EPNP for RGB-D
    
    # Feature detection / 特征检测
    Vis/FeatureType: "6"             # 6=ORB
    Vis/MaxFeatures: "1500"          # 提取特征数
    Vis/MinInliers: "20"             # 最小内点数
    
    # Correspondence / 对应关系
    Vis/CorNNDR: "0.8"               # Nearest-neighbor distance ratio
    Vis/CorGuessWinSize: "40"        # Correspondence window size
    
    # Robustness / 鲁棒性
    Vis/MaxDepth: "5.0"              # Max depth for features
    Vis/MinDepth: "0.2"              # Min depth for features
    Vis/RoiRatios: "0.0 0.0 0.0 0.0" # Use full image
    
    # Depth filtering / 深度过滤
    Vis/DepthAsMask: "true"          # Use depth as mask
    
    # ========================================================================
    # Keypoint Detection / 关键点检测
    # ========================================================================
    
    Kp/DetectorStrategy: "6"         # 6=ORB
    Kp/MaxFeatures: "600"            # Features for matching
    Kp/BadSignRatio: "0.4"           # Bad/good signature ratio threshold
    
    # ⚠️ 关键：不使用词典，改用描述符暴力匹配
    Kp/IncrementalDictionary: "false" # 禁用词典（Word表为空时必须false）
    Kp/NNStrategy: "1"                # 1=暴力匹配（不依赖词典），3=FLANN需要词典
    Kp/TfIdfLikelihoodUsed: "false"   # 不使用TF-IDF（需要词典）
    
    # ========================================================================
    # Memory Management - LOCALIZATION MODE / 内存管理 - 定位模式
    # ========================================================================
    
    # 🎯 关键参数：定位模式（不建图）/ Key Parameters: Localization Mode (No Mapping)
    Mem/IncrementalMemory: "false"   # ⚠️ 不建图！只定位 / No mapping! Localization only
    Mem/InitWMWithAllNodes: "true"   # ⚠️ 加载完整地图 / Load complete map
    
    # Short-term memory / 短期记忆
    Mem/STMSize: "30"                # Keep last 30 nodes in STM
    
    # Transfer to long-term memory / 转移到长期记忆
    Mem/RehearsalSimilarity: "0.7"   # Similarity threshold for rehearsal
    
    # ========================================================================
    # Loop Closure Detection / 闭环检测（定位中用于重定位）
    # ========================================================================
    
    # Bag-of-Words / 词袋模型（禁用，因为Word表为空）
    Mem/BinDataKept: "true"          # ⚠️ 保持二进制数据（特征描述符）
    Mem/UseOdomFeatures: "false"     # Don't use odom for detection
    Kp/IncrementalFlann: "false"     # ⚠️ 关键！不使用FLANN（Word表为空时必须false）
    
    # Localization thresholds / 定位阈值
    RGBD/LinearUpdate: "0.1"         # 定位模式可以稍微放宽 / Slightly relaxed for localization
    RGBD/AngularUpdate: "0.1"        # ~6度
    Rtabmap/LoopThr: "0.15"          # Loop closure threshold
    Rtabmap/LoopRatio: "0.8"         # Loop closure ratio
    
    # Proximity detection / 临近检测
    RGBD/ProximityBySpace: "true"    # Use space proximity
    RGBD/ProximityMaxGraphDepth: "50"
    RGBD/ProximityPathMaxNeighbors: "10"
    RGBD/ProximityAngle: "45"
    
    # ========================================================================
    # Graph Optimization / 图优化（定位模式简化）
    # ========================================================================
    
    # Optimizer / 优化器（定位模式保守配置）
    Optimizer/Strategy: "1"          # 1=g2o
    Optimizer/Iterations: "20"       # 定位模式减少迭代 / Fewer iterations in localization
    Optimizer/Epsilon: "0.0001"      # 放宽收敛阈值
    
    # Robust optimization / 鲁棒优化
    Optimizer/Robust: "false"        # ⚠️ 不使用鲁棒核（避免过度调整poses）
    Optimizer/VarianceIgnored: "false"
    Optimizer/GravitySigma: "0.3"
    Optimizer/PriorsIgnored: "false" # ⚠️ 不忽略先验（保持数据库poses）
    
    # ========================================================================
    # 2D Grid Map Generation / 2D栅格地图生成
    # ========================================================================
    
    # Grid parameters / 栅格参数
    Grid/FromDepth: "false"          # Use 3D cloud
    Grid/CellSize: "0.05"            # 5cm cell size
    
    # Obstacle height filtering / 障碍物高度过滤
    Grid/MaxObstacleHeight: "2.0"
    Grid/MinObstacleHeight: "0.1"
    Grid/MaxGroundHeight: "0.05"
    
    # Grid range / 栅格范围
    Grid/RangeMax: "5.0"
    Grid/RangeMin: "0.2"
    
    # Empty space / 空白空间
    Grid/RayTracing: "true"          # Ray tracing for empty space
    Grid/3D: "false"                 # Generate 2D map
    
    # Noise filtering / 噪声过滤
    Grid/NoiseFilteringRadius: "0.1"
    Grid/NoiseFilteringMinNeighbors: "5"
    
    # Footprint / 机器人足迹
    Grid/FootprintRadius: "0.15"     # Robot footprint radius
    
    # Occupancy / 占据概率
    Grid/ClusterRadius: "0.1"
    Grid/GroundIsObstacle: "false"
    
    # ========================================================================
    # GridGlobal Parameters - 全局地图参数（定位模式关键配置）
    # ========================================================================
    # 🔒 这些参数确保定位模式下地图不被重新生成，保持与mapping时一致
    
    GridGlobal/MinSize: "0.0"            # ⚠️ 使用0！让RTABMap根据实际poses自动计算地图大小
    GridGlobal/UpdateError: "100.0"      # ⚠️ 关键！设置很大防止地图更新（默认0.01会频繁更新）
    GridGlobal/FootprintRadius: "0.15"   # 与Grid/FootprintRadius保持一致
    GridGlobal/FullUpdate: "false"       # 不使用完整更新（定位模式不需要）
    GridGlobal/MaxNodes: "0"             # 使用所有节点组装地图（0=unlimited）
    GridGlobal/AltitudeDelta: "0"        # 禁用多层地图
    GridGlobal/Eroded: "false"           # 不侵蚀障碍物
    GridGlobal/OccupancyThr: "0.5"       # 占据阈值
    
    # ========================================================================
    # Real-time Optimization / 实时性优化
    # ========================================================================
    
    # Processing / 处理
    Rtabmap/DetectionRate: "1.0"     # 定位模式可以提高到1Hz / Can be 1Hz in localization mode
    Rtabmap/TimeThr: "0"             # No time threshold
    
    # Memory limits / 内存限制
    Rtabmap/MemoryThr: "0"           # No memory threshold
    Rtabmap/MaxRetrieved: "2"        # Max nodes retrieved
    
    # Mapping mode / 建图模式
    Rtabmap/StartNewMapOnLoopClosure: "false"
    
    # ========================================================================
    # Logging / 日志
    # ========================================================================
    
    publish_tf: true                 # Publish TF transforms
    publish_stats: true              # Publish statistics
    
    # Database / 数据库（定位模式只读配置）
    # ⚠️ 注意：启动时必须用 -d 参数指定数据库路径
    # Note: Must specify database path with -d flag when launching
    database_path: ""                # Will be overridden by launch file
    Db/Sql3InMemory: "false"         # 定位模式从磁盘加载 / Load from disk in localization mode
    DbSqlite3/InMemory: "false"      # ⚠️ 不使用内存数据库，从磁盘只读加载
    DbSqlite3/CacheSize: "10000"     # SQLite缓存大小
    DbSqlite3/JournalMode: "0"       # ⚠️ 关键！设置为DELETE模式（只读安全）
    DbSqlite3/Synchronous: "0"       # 关闭同步（只读模式不需要）
    DbSqlite3/TempStore: "2"         # 临时数据存储在内存

# ==============================================================================
# RTABMap Minimal Configuration for Real Hardware
# RTABMap真机最小化配置 - 模仿仿真的成功模式
# ==============================================================================
#
# Philosophy / 设计理念:
#   Simulation works with DEFAULT parameters + remapping
#   真机也应该用默认参数，只改关键的use_sim_time
#
# ==============================================================================

rtabmap_slam:
  ros__parameters:
    # ========================================================================
    # Basic Configuration / 基础配置
    # ========================================================================
    
    # Use real hardware time / 使用真机时间
    use_sim_time: false
    
    # Frame IDs / 坐标系ID
    frame_id: base_link              # Robot base frame / 机器人基座坐标系
    # ⚠️ CRITICAL: Do NOT set odom_frame_id here! 
    # 关键：不要在这里设置odom_frame_id！
    # If odom_frame_id is set, RTABMap will FORCE subscribe_odom=false and get odom from TF instead!
    # 如果设置了odom_frame_id，RTABMap会强制禁用subscribe_odom并从TF获取里程计！
    # See CommonDataSubscriber.cpp:531-540
    # odom_frame_id: odom  # ← COMMENTED OUT to allow topic subscription
    map_frame_id: map                # Map frame / 地图坐标系
    
    # ========================================================================
    # Topic Subscription / 话题订阅 (与仿真一致)
    # ========================================================================
    
    # Subscribe to RGB-D data / 订阅RGB-D数据
    subscribe_rgb: true              # Subscribe to RGB image / 订阅RGB图像
    subscribe_depth: true            # Subscribe to depth image / 订阅深度图像
    subscribe_scan: false            # Don't use laser scan / 不使用激光扫描
    subscribe_stereo: false          # Not using stereo camera / 不使用双目相机
    
    # Odometry source / 里程计来源
    # ⚠️ 重新启用odom订阅测试
    subscribe_odom: true             # 启用外部odom
    subscribe_odom_info: false       # Don't need odom info / 不需要里程计信息
    
    # ⚠️ NOTE: subscribe_user_data NOT needed (RTABMap built WITHOUT RTABMAP_SYNC_USER_DATA macro)
    # 注意：不需要subscribe_user_data（RTABMap编译时未启用RTABMAP_SYNC_USER_DATA宏）
    # Setting it to true will cause ERROR and be forced back to false
    # 设置为true会导致ERROR并被强制改回false
    
    # Disable laser scan related warnings / 禁用laser scan相关警告
    subscribe_scan_cloud: false
    gen_scan: false
    
    # ========================================================================
    # RGB-D Parameters / RGB-D参数 (与仿真一致)
    # ========================================================================
    
    rgbd_cameras: 1                  # Number of RGB-D cameras / RGB-D相机数量
    
    # Synchronization / 同步
    approx_sync: true                # Allow approximate time sync / 允许近似时间同步
    # ⚠️ REMOVED: approx_sync_max_interval doesn't exist in ROS2 RTABMap
    # 改用sync_queue_size缓存足够多的帧来匹配异步时间戳
    
    # Queue size / 队列大小 (相机时间戳异步需要超大队列缓存多帧)
    sync_queue_size: 500             # ⚠️ 超大队列：500帧 @15Hz = 33秒缓存
    topic_queue_size: 500            # 话题队列同步增加
    queue_size: 500                  # ROS订阅者队列大小
    
    # TF Transform Waiting / TF变换等待
    # ⚠️ 分布式部署专用配置：容忍跨网络TF延迟
    wait_for_transform: 2.0          # ⚠️ 增加到2.0s等待TF（分布式网络延迟）
    tf_delay: 0.2                    # TF publish delay (200ms buffer) / TF发布延迟（200ms缓冲，适配网络抖动）
    tf_tolerance: 0.5                # TF lookup tolerance (500ms) / TF查询容差（500ms，容忍跨机器延迟）
    
    # ========================================================================
    # Real Hardware Specific / 真机特定配置
    # ========================================================================
    
    # ⚠️ CRITICAL QoS配置：分布式WiFi环境优化
    # 必须使用RELIABLE确保数据完整性,否则approx_sync无法匹配
    qos: 1                           # General QoS (RELIABLE) 通用QoS
    qos_odom: 1                      # Odometry specific QoS (RELIABLE) 里程计专用QoS
    qos_image: 1                     # ⚠️ 改回RELIABLE,确保color/depth同步
    qos_camera_info: 1               # Camera info也用RELIABLE
    
    # ========================================================================
    # 2D SLAM Mode (Critical for stability) / 2D SLAM模式（稳定性关键）
    # ========================================================================
    
    # Force 2D mode (3DOF: x, y, yaw only) to eliminate z/roll/pitch instability
    # 强制2D模式（仅3自由度：x, y, yaw）消除z/roll/pitch不稳定性
    Reg/Force3DoF: 'true'            # ⚠️ CRITICAL: Force 2D registration / 关键：强制2D配准
    
    # Optimize only from graph end (faster, more stable than full graph optimization)
    # 仅从图末端优化（比全图优化更快更稳定）
    RGBD/OptimizeFromGraphEnd: 'true'  # Reduce optimization overhead / 减少优化开销
    
    # ⚠️ 树莓派性能优化：降低SLAM检测频率
    Rtabmap/DetectionRate: '0.5'     # 2秒处理一帧（从默认1Hz降低，减少50% CPU）
    Vis/MaxFeatures: '200'           # 最大特征点数量（从默认400降低）
    GFTT/MinDistance: '10'           # 特征点最小距离（增加，减少特征点数量）
    
    # ========================================================================
    # 方案A: 禁用视觉角度估计，完全信任IMU角度 (2026-02-11)
    # Solution A: Disable visual angle estimation, fully trust IMU angle
    # ========================================================================
    # Why: 视觉里程计(160×120+200特征)在低分辨率下角度估计不可靠，
    #      与IMU稳定角度产生18°冲突导致地图模糊
    #      Visual odometry unreliable at low resolution, conflicts with stable IMU
    
    Odom/Strategy: '0'               # ⚠️ 新增：禁用视觉里程计角度估计 (0=Frame-to-Map, no visual odom)
    
    # Increase odometry trust (reduce visual odometry drift corrections)
    # 增加里程计信任度（减少视觉里程计漂移修正）
    RGBD/AngularUpdate: '10.0'       # ⚠️ 改为10.0：大阈值=禁用角度更新 (原0.05)
    RGBD/LinearUpdate: '0.05'        # Min linear change to add keyframe (m) / 添加关键帧的最小线性变化
    
    # ⚠️ CRITICAL: 增加里程计协方差容忍度（修复 "Odometry is reset" 警告）
    # EKF输出协方差~0.0045，需要提高RTABMap的容忍度
    odom_tf_linear_variance: 0.01    # Odometry linear variance threshold (default ~0.001) / 里程计线性方差阈值
    odom_tf_angular_variance: 0.001  # ⚠️ 改为0.001：完全信任odom角度（IMU来源，稳定±0.001°）(原0.01)
    RGBD/NewMapOdomChangeDistance: '0'  # Disable new map on odom change / 禁用里程计变化时创建新地图
    RGBD/ForceOdom3DoF: 'true'       # Force 2D odometry / 强制2D里程计
    Mem/UseOdomFeatures: 'false'     # Don't use odom features / 不使用里程计特征


# ==============================================================================
# RTABMap RGB-D Visual SLAM Configuration
# RTABMap RGB-D 视觉SLAM配置
# ==============================================================================
#
# Purpose / 用途:
#   Visual SLAM using RGB-D camera for high-quality mapping
#   使用RGB-D相机的视觉SLAM，实现高质量建图
#
# Advantages over depth-to-laser / 相比depth转laser的优势:
#   - Rich visual features (500+ vs 20 points)
#   - Strong loop closure detection (visual features vs geometry)
#   - Stable mapping (no drift from poor scan matching)
#   - 3D obstacle perception
#
# ==============================================================================

# ⚠️ CRITICAL: Key must match node name 'rtabmap_slam' for params to load!
# 关键：key必须匹配节点名'rtabmap_slam'参数才能加载！
rtabmap_slam:
  ros__parameters:
    # ========================================================================
    # Basic Configuration / 基础配置
    # ========================================================================
    
    # Use simulation time / 使用仿真时间
    use_sim_time: true
    
    # Frame IDs / 坐标系ID
    frame_id: base_link              # Robot base frame / 机器人基座坐标系
    odom_frame_id: odom              # Odometry frame / 里程计坐标系
    map_frame_id: map                # Map frame / 地图坐标系
    
    # ========================================================================
    # Topic Subscription / 话题订阅
    # ========================================================================
    
    # Subscribe to RGB-D data / 订阅RGB-D数据
    subscribe_rgb: true              # Subscribe to RGB image / 订阅RGB图像
    subscribe_depth: true            # Subscribe to depth image / 订阅深度图像
    subscribe_scan: false            # Don't use laser scan / 不使用激光扫描
    subscribe_stereo: false          # Not using stereo camera / 不使用双目相机
    
    # Odometry source / 里程计来源
    subscribe_odom_info: false       # Don't need odom info / 不需要里程计信息
    
    # ========================================================================
    # RGB-D Parameters / RGB-D参数
    # ========================================================================
    
    rgbd_cameras: 1                  # Number of RGB-D cameras / RGB-D相机数量
    
    # Synchronization / 同步
    # Allow approximate time sync (Real hardware timestamps have delays)
    # 允许近似时间同步(真机时间戳有延迟)
    approx_sync: true
    approx_sync_max_interval: 0.1    # Max 100ms difference (真机需要更宽松) / 最大100ms差异
    
    # Queue size / 队列大小
    # CRITICAL: Must be large enough for 4-topic sync (odom+rgb+depth+camera_info)
    # 关键：必须足够大以同步4个话题(里程计+RGB+深度+相机信息)
    sync_queue_size: 30              # 增大到30解决同步失败 (was 10)
    topic_queue_size: 30             # Topic input queue (was not set, defaults to 10)
    
    # ========================================================================
    # Visual Odometry / 视觉里程计
    # ========================================================================
    
    # Estimation type / 估计类型
    # 0=3D->3D (ICP), 1=3D->2D (PnP/EPNP), 2=2D->2D
    # For RGB-D, use 1 (EPNP) which is more robust
    # 对于RGB-D使用1(EPNP)更稳健
    Vis/EstimationType: "1"
    
    # Feature detection / 特征检测
    Vis/FeatureType: "6"             # 6=ORB, 0=SURF, 1=SIFT (ORB fastest)
    Vis/MaxFeatures: "2000"          # Extract 2000 features per frame (提高特征丰富度) / 每帧提取2000个特征
    Vis/MinInliers: "30"             # Minimum inliers for valid pose (提高质量要求) / 有效位姿的最小内点数
    
    # Correspondence / 对应关系
    Vis/CorNNDR: "0.7"               # Nearest-neighbor distance ratio (降低到0.7，更严格匹配) / 最近邻距离比
    Vis/CorGuessWinSize: "20"        # Correspondence window size (减小窗口，提高精度) / 对应窗口大小
    Vis/CorType: "0"                 # 0=Features Matching (最精确)
    
    # Robustness / 鲁棒性
    Vis/MaxDepth: "4.0"              # Max depth for features (进一步降低，减少远距噪声) / 特征最大深度
    Vis/MinDepth: "0.3"              # Min depth for features (提高阈值，过滤近距噪声) / 特征最小深度
    Vis/RoiRatios: "0.0 0.0 0.0 0.0" # Use full image / 使用完整图像
    
    # Depth filtering / 深度过滤
    Vis/DepthAsMask: "true"          # Use depth as mask for features / 使用深度作为特征掩码
    
    # ========================================================================
    # Keypoint Detection / 关键点检测
    # ========================================================================
    
    Kp/DetectorStrategy: "6"         # 6=ORB
    Kp/MaxFeatures: "600"            # Features for loop closure (increased) / 闭环检测特征数
    Kp/BadSignRatio: "0.4"           # Bad/good signature ratio threshold (more strict) / 坏/好签名比率阈值
    
    # ========================================================================
    # Memory Management / 内存管理
    # ========================================================================
    
    # Short-term memory / 短期记忆
    Mem/STMSize: "30"                # Keep last 30 nodes in STM / 短期记忆保留30个节点
    
    # Incremental mode / 增量模式
    Mem/IncrementalMemory: "true"    # Build map incrementally / 增量建图
    
    # Transfer to long-term memory / 转移到长期记忆
    Mem/RehearsalSimilarity: "0.7"   # Similarity threshold for rehearsal (increased for stricter matching) / 重演相似度阈值（提高以更严格匹配）
    
    # ========================================================================
    # Loop Closure Detection / 闭环检测
    # ========================================================================
    
    # Bag-of-Words / 词袋模型
    Mem/BinDataKept: "true"          # ⚠️ 关键！保留二进制数据（包括词典）到数据库
    Mem/RawDescriptorsKept: "true"   # ⚠️ 保留原始描述符到数据库
    Mem/ImageKept: "false"            # 不保存完整图像（节省空间）
    Mem/UseOdomFeatures: "false"     # Don't use odom for loop detection / 不用里程计做闭环
    
    # Depth image format / 深度图像格式
    Mem/SaveDepth16Format: "false"   # ⚠️ 使用32位格式（支持>65米深度）
    Mem/DepthCompressionFormat: ".png" # ⚠️ 使用PNG压缩（兼容32位格式）
    
    # Vocabulary/Dictionary settings / 词典设置
    Kp/IncrementalDictionary: "true" # ⚠️ 增量词典（mapping时必须true）
    Kp/IncrementalFlann: "true"      # 使用增量FLANN索引
    Kp/FlannRebalancingFactor: "2.0" # FLANN重建因子（默认2.0）
    Kp/NNStrategy: "3"                # 3=FLANN_KDTREE（最佳性能）
    
    # Database settings / 数据库设置
    DbSqlite3/InMemory: "false"       # ⚠️ 不使用内存数据库，确保数据写入磁盘
    DbSqlite3/CacheSize: "10000"      # SQLite缓存大小
    DbSqlite3/JournalMode: "3"        # 3=WAL模式（更好的并发写入）
    DbSqlite3/Synchronous: "1"        # 1=NORMAL（平衡性能和安全）
    
    # Loop closure thresholds / 闭环阈值
    RGBD/LinearUpdate: "0.1"         # Min translation to add node (10cm, 减少节点密度) / 添加节点的最小平移
    RGBD/AngularUpdate: "0.1"        # Min rotation to add node (~6°, 减少角度噪声累积) / 添加节点的最小旋转
    Rtabmap/LoopThr: "0.2"           # Loop closure threshold (提高到0.2，更严格) / 闭环阈值（越高越严格）
    Rtabmap/LoopRatio: "0.9"         # Loop closure ratio (提高到0.9) / 闭环比率
    
    # Proximity detection / 临近检测
    RGBD/ProximityBySpace: "true"    # Use space proximity / 使用空间临近
    RGBD/ProximityMaxGraphDepth: "50" # Max graph depth for proximity / 临近的最大图深度
    RGBD/ProximityPathMaxNeighbors: "10" # Max neighbors in path / 路径最大邻居数
    RGBD/ProximityAngle: "45"        # Max angle for proximity (deg) / 临近最大角度
    
    # Loop closure validation / 闭环验证
    RGBD/LoopClosureReextractFeatures: "true" # Re-extract for better accuracy / 重新提取以提高精度
    RGBD/OptimizeFromGraphEnd: "true" # Optimize from graph end to reduce drift / 从图末端优化减少漂移
    RGBD/LoopClosureIdentityGuess: "false" # Don't assume identity for loop closure / 不假设闭环为恒等变换
    
    # ========================================================================
    # 2D Mode Constraints (Ground Robot) / 2D模式约束(地面机器人)
    # ========================================================================
    
    # Force 3DoF (x, y, yaw only) for ground robots
    # 强制3自由度(仅x, y, yaw)用于地面机器人
    Reg/Force3DoF: "true"            # ⚠️ 关键！强制2D模式，消除z/pitch/roll漂移
    RGBD/OptimizeMaxError: "1.0"     # 优化最大误差阈值(米)
    
    # ========================================================================
    # Graph Optimization / 图优化
    # ========================================================================
    
    # Optimizer / 优化器
    Optimizer/Strategy: "1"          # 0=TORO, 1=g2o, 2=GTSAM (g2o recommended)
    Optimizer/Iterations: "20"       # Optimization iterations (reduced for stability) / 优化迭代次数（减少以提高稳定性）
    Optimizer/Epsilon: "0.0001"      # Convergence threshold (relaxed) / 收敛阈值（放宽）
    
    # Robust optimization / 鲁棒优化
    Optimizer/Robust: "true"         # Use robust kernel for outlier rejection / 使用鲁棒核过滤异常值
    Optimizer/VarianceIgnored: "false" # Use variance in optimization / 在优化中使用方差
    Optimizer/GravitySigma: "0.3"    # Gravity constraint weight / 重力约束权重
    
    # ========================================================================
    # 2D Grid Map Generation / 2D栅格地图生成
    # ========================================================================
    
    # Grid parameters / 栅格参数
    Grid/FromDepth: "false"          # Use 3D cloud, not just depth / 使用3D点云而非仅深度
    Grid/CellSize: "0.05"            # 5cm cell size (same as Nav2) / 5cm栅格大小
    
    # Obstacle height filtering / 障碍物高度过滤
    Grid/MaxObstacleHeight: "2.0"    # Max obstacle height (2m ceiling) / 最大障碍物高度
    Grid/MinObstacleHeight: "0.1"    # Min obstacle height (10cm filter) / 最小障碍物高度
    Grid/MaxGroundHeight: "0.05"     # Max ground height variation / 最大地面高度变化
    
    # Grid range / 栅格范围
    Grid/RangeMax: "5.0"             # Max range for obstacles (reduced from 6.0) / 障碍物最大范围
    Grid/RangeMin: "0.2"             # Min range (increased to filter close noise) / 最小范围
    
    # Empty space / 空白空间
    Grid/RayTracing: "true"          # Ray tracing for empty space / 光线追踪标记空白
    Grid/3D: "false"                 # Generate 2D map for Nav2 / 生成2D地图供Nav2使用
    
    # Noise filtering / 噪声过滤
    Grid/NoiseFilteringRadius: "0.1" # Remove isolated points within 10cm / 移除10cm内的孤立点
    Grid/NoiseFilteringMinNeighbors: "5" # Need 5 neighbors to keep point / 需要5个邻居才保留点
    
    # Footprint / 机器人足迹
    Grid/FootprintRadius: "0.15"     # Robot footprint radius (15cm) / 机器人足迹半径
    
    # Occupancy / 占据概率
    Grid/ClusterRadius: "0.1"        # Cluster nearby obstacles / 聚类附近障碍物
    Grid/GroundIsObstacle: "false"   # Ground is not obstacle / 地面不是障碍物
    
    # ========================================================================
    # Real-time Optimization / 实时性优化
    # ========================================================================
    
    # Processing / 处理
    Rtabmap/DetectionRate: "0.3"     # 降低到0.3Hz，减少噪声累积和角度漂移
    Rtabmap/TimeThr: "0"             # No time threshold / 无时间阈值
    
    # Memory limits / 内存限制
    Rtabmap/MemoryThr: "0"           # No memory threshold (unlimited) / 无内存阈值
    Rtabmap/MaxRetrieved: "2"        # Max nodes retrieved for loop closure / 闭环最大检索节点数
    
    # Mapping mode / 建图模式
    Rtabmap/StartNewMapOnLoopClosure: "false" # Don't start new map on loop / 闭环时不新建地图
    
    # ========================================================================
    # Logging / 日志
    # ========================================================================
    
    publish_tf: true                 # Publish TF transforms / 发布TF变换
    publish_stats: true              # Publish statistics / 发布统计信息
    
    # Database / 数据库
    database_path: "~/.ros/rtabmap.db" # Database save path / 数据库保存路径
    Db/Sql3InMemory: "true"          # Use in-memory DB (faster) / 使用内存数据库(更快)

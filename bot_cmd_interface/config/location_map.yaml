# 地点映射配置文件 / Location mapping configuration file
# 将命名地点映射到机器人坐标系下的实际坐标 / Maps named locations to actual coordinates in robot coordinate system

# ========== 地点列表 / Location List ==========
locations:
  # 格式 / Format:
  # - name: "地点名称 / Location name"
  #   x: X坐标（米）/ X coordinate (meters)
  #   y: Y坐标（米）/ Y coordinate (meters)
  #   yaw: 朝向（弧度，可选）/ Yaw orientation (radians, optional)
  #   description: "描述信息 / Description"
  #   tags: ["标签1", "标签2"]  # 可选 / Optional tags
  
  - name: "厨房"
    x: 2.5
    y: 3.0
    yaw: 1.57  # 面向北 / Facing north
    description: "Kitchen area with cooking facilities"
    tags: ["room", "indoor"]
  
  - name: "客厅"
    x: 0.0
    y: 0.0
    yaw: 0.0  # 面向东 / Facing east
    description: "Living room, main gathering area"
    tags: ["room", "indoor", "main"]
  
  - name: "卧室"
    x: -2.0
    y: 3.5
    yaw: 3.14  # 面向西 / Facing west
    description: "Bedroom for rest"
    tags: ["room", "indoor", "private"]
  
  - name: "阳台"
    x: 4.0
    y: -1.0
    yaw: 0.0
    description: "Balcony with outdoor view"
    tags: ["outdoor", "balcony"]
  
  - name: "充电桩"
    x: -1.5
    y: -2.0
    yaw: -1.57  # 面向南 / Facing south
    description: "Charging station for robot"
    tags: ["utility", "charging"]


# ========== 地图元数据 / Map Metadata ==========
metadata:
  coordinate_frame: "map"
  # 坐标系 / Coordinate frame
  
  map_name: "home_floor1"
  # 地图名称 / Map name
  
  created_at: "2026-01-07"
  # 创建日期 / Creation date
  
  last_updated: "2026-01-07"
  # 最后更新日期 / Last updated date
  
  version: "1.0.0"
  # 配置文件版本 / Configuration file version


# ========== 配置说明 / Configuration Notes ==========
# 1. 坐标单位为米，原点为地图原点 / Coordinates in meters, origin at map origin
# 2. yaw朝向单位为弧度，0为正东方向，逆时针为正 / yaw in radians, 0 is east, counter-clockwise positive
# 3. yaw为可选项，如果不指定则保持当前朝向 / yaw is optional, robot keeps current orientation if not specified
# 4. name字段必须唯一 / name field must be unique
# 5. 支持中英文地点名称 / Supports both Chinese and English location names
# 6. tags用于分类和过滤，可根据需要自定义 / tags for categorization and filtering, customizable

# ExplorationManager 配置文件
# Autonomous Exploration Configuration

exploration_manager:
  ros__parameters:
    # 地图相关
    map_topic: '/map'
    map_frame: 'map'
    
    # 探索参数
    exploration_radius: 5.0          # 探索半径(m)
    min_frontier_size: 5             # 最小边界点数
    min_goal_distance: 1.0           # 最小目标距离(m) - 从0.2增加到1.0，避免选择过近目标
    goal_tolerance: 0.3              # 目标容差(m)
    safe_distance: 0.15              # 安全距离(m) - 从0.20降到0.15，减少goal validation检查范围
    
    # 运动参数
    forward_speed: 0.20              # 前进速度(m/s)
    rotation_speed: 0.5              # 旋转速度(rad/s)
    
    # 地图完成度
    map_completion_threshold: 0.78   # 地图完成度阈值（降低，因为实际可探索区域<100%）
    min_completion_threshold: 0.75   # 最小完成度阈值（接近完成且无frontier时提前结束）
    stagnant_threshold: 2            # 停滞阈值（次数）
    
    # 相机参数
    camera_fov: 60.0                 # 相机视场角(度)
    
    # 超时设置
    goal_timeout: 100.0              # 目标超时时间(秒) - 增加到100秒
    max_failures: 8                  # 最大连续失败次数（增加容错）
    
    # 智能探索
    enable_smart_exploration: true   # 启用智能探索
    visit_radius: 0.5                # 已访问判定半径(m)
    rotation_angle: 45.0             # 旋转角度(度)
    max_no_goal_count: 5             # 最大无目标次数（增加，避免过早终止）

# ==============================================================================
# Nav2 导航参数配置 for IMU Mode / IMU模式 Nav2 导航参数配置
# 适用于 LeKiwi 三轮全向移动机器人 / For LeKiwi 3-wheel omnidirectional robot
# 基于轮式里程计 + IMU 融合，移除VIO相关限制 / Based on wheel odometry + IMU fusion, removed VIO restrictions
# ==============================================================================

amcl:
  ros__parameters:
    use_sim_time: True
    
    # 全局定位参数 / Global localization parameters
    alpha1: 0.2       # 旋转噪声(旋转) / Rotation noise from rotation
    alpha2: 0.2       # 旋转噪声(平移) / Rotation noise from translation
    alpha3: 0.2       # 平移噪声(平移) / Translation noise from translation
    alpha4: 0.2       # 平移噪声(旋转) / Translation noise from rotation
    alpha5: 0.2       # 全向运动噪声 / Omnidirectional motion noise
    
    base_frame_id: "base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beams_skip: false
    global_frame_id: "map"
    
    # 激光雷达参数 / Laser parameters
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 8.0
    # 最小距离设为0.05m(5cm)以支持近距离检测 / Min range 0.05m(5cm) for close-range detection
    laser_min_range: 0.05
    laser_model_type: "likelihood_field"
    
    # 粒子滤波参数 / Particle filter parameters
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    
    # 全向运动模型 / Omnidirectional motion model
    robot_model_type: "nav2_amcl::OmniMotionModel"
    
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    
    # 更新阈值 / Update thresholds
    update_min_a: 0.2   # 最小旋转更新 / Minimum rotation update
    update_min_d: 0.1   # 最小平移更新 / Minimum translation update
    
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    
    scan_topic: scan

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered
    bt_loop_duration: 20           # 从10增到20ms，降低BT tick rate到50Hz，减轻CPU负载
    default_server_timeout: 30     # 从20增到30秒，给recovery更多时间
    wait_for_service_timeout: 5    # 服务等待超时5秒
    
    # 探索模式专用行为树 - 减少重试次数(2次)和recovery动作
    # Exploration-specific behavior tree - reduced retries (2) and recovery actions
    default_nav_to_pose_bt_xml: /home/hurry/lododo_bot/src/bot_navigation/config/nav2/exploration_bt.xml
    default_nav_through_poses_bt_xml: /opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml
    
    # 导航插件 / Navigation plugins
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 10.0        # 从 20.0 降到 10.0，减轻 CPU 负载
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001  # 全向运动需要 / Required for omnidirectional motion
    min_theta_velocity_threshold: 0.001
    
    failure_tolerance: 0.3
    
    # 进度检查 / Progress checker
    progress_checker_plugin: "progress_checker"
    # Progress Checker - 使用PoseProgressChecker支持旋转检测
    # Use PoseProgressChecker to detect BOTH linear and angular movement
    # 使用PoseProgressChecker同时检测线性和角度运动
    # 探索模式：严格超时检测，避免在不可达目标上耗费过多时间
    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.30   # 优化: 0.20 -> 0.30 (10秒内必须移动30cm)
      required_movement_angle: 0.174   # 或角度变化10度(0.174弧度)，满足一个即可
      movement_time_allowance: 10.0    # 优化: 20.0 -> 10.0 (更严格的超时检测)
    
    # 目标检查器 / Goal checker
    goal_checker_plugins: ["general_goal_checker"]
    current_goal_checker: "general_goal_checker"  # 指定默认goal checker，消除警告
    general_goal_checker:
      stateful: False               # 探索模式：关闭stateful，到达即成功，无需停止
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.30       # 位置容差30cm（进一步放宽，减少最后调整）
      yaw_goal_tolerance: 0.79      # 角度容差45度（0.79弧度，约束更宽松）
    
    # 控制器插件 / Controller plugins
    controller_plugins: ["FollowPath"]
    
    # DWB 控制器 - 适合全向轮 / DWB Controller - suitable for omnidirectional wheels
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      
      # 调试 / Debug
      debug_trajectory_details: True
      
      # 速度限制 / Velocity limits (Ground Truth里程计支持更高速度)
      # Higher speed enabled with accurate Ground Truth odometry
      # 允许小速度后退用于脱困，依赖local_costmap障碍物信息
      min_vel_x: -0.1               # 允许小速度后退(-0.1m/s)用于脱困场景
      max_vel_x: 0.30               # 提升到0.30m/s（Ground Truth精度保证）
      min_vel_y: -0.30              # 允许侧移（FOV可部分覆盖）
      max_vel_y: 0.30               # 全向最大速度提升
      max_vel_theta: 0.8            # 提升旋转速度到0.8rad/s，加快转向 / Faster rotation
      min_speed_xy: 0.0             # 允许慢速和停止 / Allow slow speeds and stopping
      max_speed_xy: 0.30            # 保持一致
      min_speed_theta: 0.0
      
      # 加速度限制 / Acceleration limits (提升以支持更高速度)
      # Increased acceleration for higher speed operation
      acc_lim_x: 2.5                # 提升加速度支持0.3m/s
      acc_lim_y: 2.5                # 全向运动 / Omnidirectional motion
      acc_lim_theta: 3.0            # 提升角加速度
      decel_lim_x: -2.5             # 提升减速度
      decel_lim_y: -2.5             # 全向运动 / Omnidirectional motion
      decel_lim_theta: -2.0         # 降低角减速度
      
      # 轨迹生成参数 / Trajectory generation parameters
      # 增加采样提高避障流畅度 / Increase samples for smoother obstacle avoidance
      vx_samples: 15                # 增加到15，更细致的速度规划
      vy_samples: 10                # 增加到10，全向运动需要更多采样
      vtheta_samples: 15            # 增加到15，更流畅的旋转
      sim_time: 1.0                 # 减少到1.0s，提高响应速度
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.5      # 从0.2增加到0.5，容忍更大的TF延迟
      
      # 目标容差 / Goal tolerance (DWB内部使用)
      xy_goal_tolerance: 0.30       # 位置容差30cm（进一步放宽，减少最后调整）
      yaw_goal_tolerance: 0.79      # 角度容差45度（0.79弧度，约束更宽松）
      trans_stopped_velocity: 0.15  # 降低到0.15，更容易判断为停止
      slowing_factor: 3.0           # 减少到3.0，降低接近时的减速程度
      
      # 评分 / Scoring
      short_circuit_trajectory_evaluation: True
      stateful: True
      
      # 评价器 / Critics
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      
      # 优化权重：强化车头朝向对齐，保持全向运动能力
      # Optimized weights: enforce heading alignment while keeping omnidirectional capability
      
      # 路径对齐 - 最高优先级 (强制车头沿路径方向) / Path alignment - highest priority
      PathAlign.scale: 128.0                    # 优化: 20.0 -> 128.0 (提高6.4倍)
      PathAlign.forward_point_distance: 0.4     # 优化: 0.1 -> 0.4 (提前0.4m调整朝向)
      
      # 目标对齐 - 次高优先级 (接近目标时车头朝向目标) / Goal alignment - second priority
      GoalAlign.scale: 96.0                     # 优化: 24.0 -> 96.0 (提高4倍)
      GoalAlign.forward_point_distance: 0.3     # 优化: 0.1 -> 0.3 (提前0.3m调整朝向)
      
      # 旋转到目标 - 高优先级 / Rotate to goal - high priority
      RotateToGoal.scale: 64.0                  # 优化: 32.0 -> 64.0 (提高2倍)
      RotateToGoal.slowing_factor: 3.0          # 优化: 5.0 -> 3.0 (更早开始减速转向)
      RotateToGoal.lookahead_time: -1.0
      
      # 路径距离 - 降低优先级 (让位于朝向对齐) / Path distance - lower priority
      PathDist.scale: 20.0                      # 保持: 20.0
      
      # 目标距离 - 降低优先级 / Goal distance - lower priority  
      GoalDist.scale: 16.0                      # 优化: 24.0 -> 16.0
      
      # 障碍物避障 - 略微降低 (允许朝向优先) / Obstacle avoidance - slightly lower
      BaseObstacle.scale: 0.04                  # 优化: 0.02 -> 0.04 (保持与nav2_params.yaml一致)
      
      # 防止震荡 / Prevent oscillation
      Oscillation.scale: 1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 2.0          # 从5.0降到2.0Hz，减少costmap更新负载
      publish_frequency: 1.0         # 从2.0降到1.0Hz，减少发布频率
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # TF容差增大以适应仿真启动延迟 / Increase TF tolerance for simulation startup delay
      # 增大到10秒以处理慢速仿真 / Increase to 10s for slow simulation
      transform_tolerance: 10.0
      
      # 机器人半径 / Robot radius (for circular footprint)
      # 实际机器人直径24cm，半径12cm
      # Actual robot diameter 24cm, radius 12cm
      robot_radius: 0.12
      
      # 或使用多边形足迹 / Or use polygon footprint
      # footprint: "[[0.12, 0.0], [0.06, 0.104], [-0.06, 0.104], [-0.12, 0.0], [-0.06, -0.104], [0.06, -0.104]]"
      
      plugins: ["voxel_layer", "inflation_layer"]
      
      # 体素层 - 3D障碍物 / Voxel layer - 3D obstacles
      # Uses segmented ground and obstacle point clouds from RTABMap
      # 使用RTABMap分割的地面和障碍物点云
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        
        observation_sources: ground obstacles
        
        # Ground point cloud (clearing only, not marking)
        # 地面点云（仅清除，不标记）
        ground:
          topic: /camera/ground
          sensor_frame: camera_optical_frame
          max_obstacle_height: 0.4
          clearing: True
          marking: False
          data_type: "PointCloud2"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
        
        # Obstacle point cloud (marking and clearing)
        # 障碍物点云（标记和清除）
        obstacles:
          topic: /camera/obstacles
          sensor_frame: camera_optical_frame
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "PointCloud2"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      
      # 膨胀层 / Inflation layer
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 成本缩放因子: 提高到5.0，使膨胀区惩罚更平缓，允许贴边行驶
        # Higher value = gentler cost gradient, robot can get closer to obstacles
        # cost_scaling_factor越大，代价衰减越慢，机器人越不惧怕膨胀区
        cost_scaling_factor: 5.0  # 优化: 3.0 -> 5.0
        # 局部代价地图保持较小膨胀半径以支持窄通道
        # Local costmap keeps smaller inflation for narrow passages
        inflation_radius: 0.25    # 优化: 0.18 -> 0.25 (略微增加安全余量)
      
      always_send_full_costmap: False  # 从 True 改为 False，只发送更新

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 1.0          # 从3.0降到1.0Hz，减少全局costmap更新负载
      publish_frequency: 0.5         # 从2.0降到0.5Hz，减少发布频率
      global_frame: map
      robot_base_frame: base_link
      # TF容差增大以适应仿真启动延迟 / Increase TF tolerance for simulation startup delay
      # 增大到10秒以处理慢速仿真 / Increase to 10s for slow simulation
      transform_tolerance: 10.0
      
      # 机器人半径 / Robot radius
      # 实际机器人直径24cm，半径12cm
      robot_radius: 0.12
      
      resolution: 0.10
      track_unknown_space: true
      
      # 🔧 关键修改：改为false，使用SLAM地图边界
      # 这样可以使用static_layer读取已建图的障碍物
      # 代价：需要等待RTABMap地图初始化完成
      rolling_window: false
      width: 80  # 优化: 100->80 (8m范围足够探索使用)
      height: 80  # 优化: 100->80 (减少网格数量)
      
      # ✅ 添加static_layer，使用SLAM地图的障碍物信息
      # 已建图的障碍物会持久存在于costmap中
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      
      # 静态层 - 从SLAM地图读取已知障碍物
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true  # 订阅持久化地图
        map_topic: /map  # RTABMap发布的地图
        enabled: true
      
      # 障碍物层 / Obstacle layer
      # Uses segmented obstacle point cloud from RTABMap
      # 使用RTABMap分割的障碍物点云
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: obstacles
        
        # Obstacle point cloud for global planning
        # 障碍物点云用于全局规划
        obstacles:
          topic: /camera/obstacles
          sensor_frame: camera_optical_frame
          observation_persistence: 0.0
          expected_update_rate: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          clearing: True
          marking: True
          data_type: "PointCloud2"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          # inf_is_valid不适用于LaserScan，已移除
      
      # 膨胀层 / Inflation layer
      # 探索模式：适度膨胀，平衡安全性和可达性
      # Exploration mode: moderate inflation, balance safety and reachability
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0  # 优化: 3.0 -> 5.0 (更快衰减)
        # 探索模式：减小膨胀半径，允许更接近障碍物的目标点
        # Exploration mode: reduce inflation for goals closer to obstacles
        inflation_radius: 0.30    # 优化: 0.18 -> 0.30 (探索需要更大安全区)
      
      always_send_full_costmap: False  # 只发送更新

map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: ""
    
map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    use_sim_time: True
    
    # 降低期望频率以匹配实际性能 / Lower expected frequency to match actual performance
    expected_planner_frequency: 2.0   # 优化: 5.0->2.0 匹配实际探索需求
    
    # 规划器超时保护 / Planner timeout protection
    action_server_result_timeout: 10.0
    planner_server_timeout: 5.0
    
    planner_plugins: ["GridBased"]
    
    # NavFn 全局规划器 - 优化配置 / NavFn global planner - optimized
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      # 增加容差，允许更灵活的目标点 / Increase tolerance for more flexible goals
      tolerance: 1.0              # 优化: 0.5 -> 1.0
      # 启用A*算法，加快规划速度 / Enable A* for faster planning
      use_astar: true             # 优化: false -> true (A*比Dijkstra快3-5倍)
      # 允许穿过未知区域（探索必需）/ Allow unknown space (required for exploration)
      allow_unknown: true
      # 使用二次近似以提升性能 / Use quadratic approximation for better performance
      use_quadratic_approximation: true
      # 对角线移动代价（sqrt(2) ≈ 1.414）/ Diagonal move cost
      neutral_cost: 50
      # 致命障碍物代价 / Lethal obstacle cost  
      lethal_cost: 253
      # 代价因子（降低以放宽路径选择）/ Cost factor (lower for more flexible paths)
      cost_factor: 0.55           # 默认值，可调整

smoother_server:
  ros__parameters:
    use_sim_time: True
    
    smoother_plugins: ["simple_smoother"]
    
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    use_sim_time: True
    
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    
    # 原地旋转 / Spin in place
    spin:
      plugin: "nav2_behaviors/Spin"
      max_rotational_vel: 0.35     # 适当提高，因为Progress Checker现在可以检测旋转
      min_rotational_vel: 0.15
      rotational_acc_lim: 0.8
      simulate_ahead_time: 3.0      # 恢复到3秒，不需要过长
    
    # 后退 / Backup
    backup:
      plugin: "nav2_behaviors/BackUp"
      backup_dist: 0.10             # 恢复到10cm
      backup_speed: 0.04            # 适当提高
      time_allowance: 20.0          # 减少到20秒
      simulate_ahead_time: 3.0      # 恢复到3秒
    
    # 直线行驶 / Drive on heading
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    
    # 辅助遥控 / Assisted teleop
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    
    # 等待 / Wait
    wait:
      plugin: "nav2_behaviors/Wait"
    
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 2.0

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    
    # 速度限制 / Velocity limits (Ground Truth里程计支持更高速度)
    # Higher speed enabled with accurate Ground Truth odometry
    max_velocity: [0.30, 0.30, 0.5]      # [x, y, theta] 提升到0.3m/s
    min_velocity: [-0.30, -0.30, -0.5]   # [x, y, theta]
    
    # 加速度限制 / Acceleration limits (提升以支持更高速度)
    # Increased acceleration for higher speed operation
    max_accel: [2.5, 2.5, 3.0]           # [x, y, theta] 提升加速度
    max_decel: [-2.5, -2.5, -3.0]        # [x, y, theta] 提升减速度
    
    odom_topic: "/odometry/filtered"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]


# 自主探索建图配置
# Autonomous Exploration Mapping Configuration

exploration_mapper:
  ros__parameters:
    # 地图话题
    map_topic: "/map"
    cmd_vel_topic: "/cmd_vel"
    
    # 探索参数 / Exploration parameters
    exploration_radius: 8.0           # 探索半径(m) - 不要设太大，避免路径规划失败
    min_frontier_size: 15             # 最小边界尺寸(像素数)
    goal_tolerance: 0.25              # 目标容差(m)
    
    # 运动参数 / Motion parameters
    rotation_speed: 0.6               # 原地旋转速度(rad/s)
    forward_speed: 0.20               # 前进速度(m/s) - 匹配Nav2最大速度
    
    # 完成条件 / Completion criteria
    map_completion_threshold: 0.88    # 地图完成度阈值(0-1)
    
    # 安全参数 / Safety parameters
    safe_distance: 0.35               # 安全距离(m)
    
    # 相机参数 / Camera parameters
    camera_fov: 60.0                  # 相机FOV(度)
    
    # 相机朝向策略说明 / Camera orientation strategy
    # camera_optical_frame的Z轴(光轴)指向base_link的+X方向
    # 机器人会自动旋转使+X对准目标，然后前进
    # 保证相机60°FOV始终覆盖运动方向前方

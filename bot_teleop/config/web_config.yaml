server:
  host: 0.0.0.0
  port: 8000
  reload: false
  workers: 1
ros:
  use_sim_time: false
websocket:
  ping_interval: 30
  ping_timeout: 10
rosbridge:
  url: ws://localhost:9090
  reconnect_attempts: 5
  reconnect_interval: 5
update_rates:
  map: 1.0
  pose: 10.0
  costmap: 5.0
  planned_path: 2.0
costmap:
  opacity: 0.5
  inflation_color: rgba(255, 165, 0, 0.5)
  lethal_color: rgba(255, 0, 0, 0.5)
ui:
  language: zh-CN
  theme: light
paths:
  maps_dir: ~/workDisk/lododo_bot/maps
  waypoints_dir: ~/workDisk/lododo_bot/waypoints